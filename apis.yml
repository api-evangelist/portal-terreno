name: Portal Terreno
description: Portal Terreno is an online marketplace for land and parcels ("terrenos" and "parcelas")
  in Latin America, operating localized classifieds portals for Chile (portalterreno.cl) and Mexico
  (portalterreno.com.mx) with tens of thousands of land listings. The Next.js web platform lets buyers
  search, filter, and contact sellers to find land for sale, while sellers and real-estate agents
  publish listings. It was surfaced as a portfolio company of 500 Global and added to the API Evangelist
  network for enrichment. No public developer, API, documentation, or well-known discovery surface was
  found during the enrichment pass; the domain-security posture was probed live.
